[gcode_macro PAUSE]
description: Pause the actual running print
rename_existing: PAUSE_BASE
# change this if you need more or less extrusion
variable_extrude: 1.0
gcode:
  ##### read E from pause macro #####
  {% set E = printer["gcode_macro PAUSE"].extrude|float %}
  ##### set park positon for x and y #####
  # default is your max posion from your printer.cfg
  {% set x_park = printer.toolhead.axis_maximum.x|float - 5.0 %}
  {% set y_park = printer.toolhead.axis_maximum.y|float - 5.0 %}
  ##### calculate save lift position #####
  {% set max_z = printer.toolhead.axis_maximum.z|float %}
  {% set act_z = printer.toolhead.position.z|float %}
  {% if act_z < (max_z - 2.0) %}
      {% set z_safe = 2.0 %}
  {% else %}
      {% set z_safe = max_z - act_z %}
  {% endif %}
  ##### end of definitions #####
  PAUSE_BASE
  G91
  {% if printer.extruder.can_extrude|lower == 'true' %}
    G1 E-{E} F2100
  {% else %}
    {action_respond_info("Extruder not hot enough")}
  {% endif %}
  {% if "xyz" in printer.toolhead.homed_axes %}
    G1 Z{z_safe} F900
    G90
    G1 X{x_park} Y{y_park} F6000
  {% else %}
    {action_respond_info("Printer not homed")}
  {% endif %} 

[gcode_macro RESUME]
description: Resume the actual running print
rename_existing: RESUME_BASE
gcode:
  ##### read E from pause macro #####
  {% set E = printer["gcode_macro PAUSE"].extrude|float %}
  #### get VELOCITY parameter if specified ####
  {% if 'VELOCITY' in params|upper %}
    {% set get_params = ('VELOCITY=' + params.VELOCITY)  %}
  {%else %}
    {% set get_params = "" %}
  {% endif %}
  ##### end of definitions #####
  {% if printer.extruder.can_extrude|lower == 'true' %}
    G91
    G1 E{E} F2100
  {% else %}
    {action_respond_info("Extruder not hot enough")}
  {% endif %}  
  RESUME_BASE {get_params}

[gcode_macro CANCEL_PRINT]
description: Cancel the actual running print
rename_existing: CANCEL_PRINT_BASE
gcode:
  TURN_OFF_HEATERS
  M83 ; <--- ADD THIS: Set extruder to RELATIVE mode
  G1 E-5 F2700 ; Retract 5mm
  G91 ; <--- ADD THIS: Set all axes to RELATIVE mode
  G1 Z50 F3000 ; Raise 50mm safely
  G90 ; Back to Absolute mode
  # Disable steppers
    M84
  CANCEL_PRINT_BASE

[gcode_macro PRINT_START]
description: Optimized Start for Kobra Max Direct Drive
gcode:
  {% set BED_TEMP = params.BED|default(60)|float %}
  {% set EXTRUDER_TEMP = params.EXTRUDER|default(210)|float %}

  G92 E0 ; Reset Extruder
  M220 S100 ; Reset to 100% speed
  M221 S100 ; Reset flow to 100%

  # --- SIMULTANEOUS HEATING ---
  M140 S{BED_TEMP}             ; Start heating bed
  M104 S150                    ; Pre-heat nozzle to 150 (prevents oozing)

  G28 ; Home all axes

  # --- WAIT FOR BED ---
  M190 S{BED_TEMP}             ; Wait for bed to reach final temp
  
  # --- ADAPTIVE MESH ---
  BED_MESH_CALIBRATE ADAPTIVE=1

  # --- FINAL NOZZLE HEAT ---
  G1 Z10 F3000                 ; Move up to heat safely
  M109 S{EXTRUDER_TEMP}        ; Wait for nozzle to reach temp

  # --- PURGE & SNAP ---
  LINE_PURGE

  # --- TRANSITION TO PRINT ---
  G90
  G92 E0                       ; Final Extruder Reset


[gcode_macro PRINT_END]
gcode:
    # 1. Initial Retraction & Slight Lift (Clear the surface)
    G91 ; Relative positioning
    G1 E-2 Z0.2 F2700 ; Fast retract 2mm and tiny lift to prevent scarring
    
    # 2. The "Flick" (Fast diagonal move to snap PETG strings)
    # We move X and Y significantly at high speed
    G1 X20 Y20 Z2 F9000 
    
    # 3. Safety Move (Raise nozzle 50mm)
    # Using a higher speed (F3000) than your previous F300 for efficiency
    G1 Z50 F3000 
    
    # 4. Global Cooldown (Now that we are clear of the part)
    G90 ; Absolute positioning
    M140 S0 ; Turn off bed
    M104 S0 ; Turn off extruder
    M106 S0 ; Turn off fan
    
    # 5. Disable steppers
    M84
    
    # 6. Notification
    PUSH_NOTIFY MSG="Print finished" DEVICE=iphone

[gcode_macro LOAD_FILAMENT]
gcode:
    {% set TEMP = params.TEMP|default(210)|float %}
    {% set PURGE = params.PURGE|default(60)|float %} # Volcano needs a decent purge

    SAVE_GCODE_STATE NAME=load_state
    M117 Loading...
    
    # Heat nozzle if needed
    {% if printer.extruder.temperature < TEMP %}
        M117 Heating to {TEMP}C
        M109 S{TEMP}
    {% endif %}

    G91                  # Relative positioning
    G1 E25 F300          # Initial feed into the gears
    G1 E{PURGE} F150     # Slow purge to clear the large Volcano melt zone
    
    G1 E-1 F300          # Tiny retract to stop ooze
    M400                 # Wait for moves to finish
    M117 Load Complete
    RESTORE_GCODE_STATE NAME=load_state

[gcode_macro UNLOAD_FILAMENT]
gcode:
    {% set TEMP = params.TEMP|default(210)|float %}

    SAVE_GCODE_STATE NAME=unload_state
    
    {% if printer.extruder.temperature < TEMP %}
        M117 Heating to {TEMP}C
        M109 S{TEMP}
    {% endif %}

    M117 Unloading...
    G91                  # Relative positioning
    G1 E5 F300           # Quick push to melt the tip
    G1 E-15 F2000        # Fast "Snap" retract to pull out of melt zone
    G1 E-40 F600         # Slower move to clear the drive gears
    
    M117 Unload Complete
    RESTORE_GCODE_STATE NAME=unload_state

[gcode_macro SET_MATERIAL_VARS]
gcode:
    {% set MATERIAL = params.MATERIAL|default('PLA')|string %}
    # Fetch the default PA from the extruder config object
    {% set DEFAULT_PA = printer.configfile.settings.extruder.pressure_advance|float %}
    
    {% if MATERIAL == 'PETG' %}
        SET_GCODE_OFFSET Z_ADJUST=-0.12 ; .12 lower seems to be the sweet spot
        SET_PRESSURE_ADVANCE ADVANCE=0.05            ; Specific PETG override
        M220 S25                                     ; 50% Speed
        M117 Material: PETG | Speed: 50%
    {% elif MATERIAL == 'TPU' %}
        SET_GCODE_OFFSET Z=0                         ; Reset Offset
        SET_PRESSURE_ADVANCE ADVANCE=0.08            ; Higher PA for flexible filament
        # Firmware Retraction Overrides
        SET_RETRACTION RETRACT_LENGTH=1.0 RETRACT_SPEED=35 UNRETRACT_SPEED=25
        M117 Material: TPU
    {% else %}
        SET_GCODE_OFFSET Z=0                         ; Reset Offset
        SET_PRESSURE_ADVANCE ADVANCE={DEFAULT_PA}    ; Dynamically return to Config Default
        M220 S100                                    ; 100% Speed
        M117 Material: {MATERIAL} | PA: {DEFAULT_PA}
    {% endif %}
